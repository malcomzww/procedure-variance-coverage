name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      # The drift gate. Results are regenerated from source and the run fails
      # if anything moved, so a hand-edited number in results/ cannot survive a
      # push. This is the check that makes the README's figures trustworthy
      # rather than merely asserted.
      - name: Regenerate results
        run: uv run python scripts/generate_results.py

      - name: Fail on results drift
        run: git diff --exit-code results/
